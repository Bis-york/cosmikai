version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: cosmikai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cosmikai-backend
    environment:
      COSMIKAI_MONGO_URI: mongodb://mongo:27017/
      COSMIKAI_MONGO_DB: exoplanet_DB
      COSMIKAI_MONGO_COLLECTION: predictions
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  base-frontend:
    build:
      context: ./base_frontend
      dockerfile: Dockerfile
    container_name: cosmikai-base-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_VISUAL_BASE_URL: http://localhost:5173
    ports:
      - "5180:5180"
    depends_on:
      - backend
      - visual-frontend

  visual-frontend:
    build:
      context: ./visual_frontend
      dockerfile: Dockerfile
    container_name: cosmikai-visual-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
