version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cosmikai-backend
    environment:
      # Update this to point to your existing MongoDB
      COSMIKAI_MONGO_URI: mongodb://host.docker.internal:27017/
      COSMIKAI_MONGO_DB: exoplanet_DB
      COSMIKAI_MONGO_COLLECTION: predictions
    ports:
      - "8000:8000"
    network_mode: bridge
