version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: cosmikai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cosmikai-backend
    environment:
      COSMIKAI_MONGO_URI: mongodb://mongo:27017/
      COSMIKAI_MONGO_DB: exoplanet_DB
      COSMIKAI_MONGO_COLLECTION: predictions
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo-data:
